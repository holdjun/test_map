<style>

          font-size:12px; font-weight:700; color:var(--reset-ink); box-shadow:0 4px 14px rgba(0,0,0,.18); }
  .reset.show{ display:inline-block; }
  .panel{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
          padding:12px max(12px,env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right)); }
  table{ width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; background:var(--card);
         border-radius:20px; overflow:hidden; box-shadow:0 2px 14px var(--shadow); font-size:13px; }
  col.c-day{ width:15%; } col.c-route{ width:50%; } col.c-dist{ width:16%; } col.c-stay{ width:19%; }
  th,td{ padding:9px 7px; vertical-align:top; border-bottom:1px solid var(--line2); text-align:left;
         word-break:break-word; overflow-wrap:anywhere; }
  th{ background:var(--th); font-size:12px; color:var(--sub); font-weight:600; }
  tr:last-child td{ border-bottom:none; }
  td.dist{ color:var(--sub); font-variant-numeric:tabular-nums; }
  .chip{ display:inline-block; color:#fff; border-radius:10px; padding:2px 9px; font-weight:800; font-size:12px; }
  .date{ display:block; color:var(--mut); font-size:11px; margin-top:3px; }
  .node{ font-weight:700; }
  .leg{ display:inline-block; color:var(--c); font-weight:800; text-decoration:none;
        border-bottom:2px solid var(--c); line-height:1.9; padding:0 2px; }
  .leg:active{ opacity:.55; }
  .tip{ color:var(--mut); font-size:11px; margin-top:4px; line-height:1.5; }
  .story{ margin-top:5px; background:var(--story-bg); color:var(--story-ink); border-radius:11px;
          padding:6px 10px; font-size:11px; line-height:1.6; }
  .stayA{ color:var(--stay); text-decoration:none; font-weight:700; }
  .stayA.flat{ color:var(--mut); font-weight:600; }
  tr.transit td{ background:var(--transit); color:var(--transit-ink); }
  tr.transit .node, tr.transit{ font-weight:500; }
  tr.selectable{ cursor:pointer; }
  tr.selectable:active td{ background:var(--row-press); }
  tr.active td{ background:var(--active); }
  tr.active td.day{ box-shadow:inset 4px 0 0 var(--rc,#333); }
</style>
</head>
<body>
<header>
  <h1>伊犁环线自驾</h1>
  <button class="theme" id="theme" title="切换日间/夜间" aria-label="切换主题">🌙</button>
</header>
<div class="strip"></div>
<div id="map">
  <button class="reset" id="reset" onclick="resetView()">↺ 显示全部路线</button>
</div>
<div class="panel">
  <table>
    <colgroup><col class="c-day"><col class="c-route"><col class="c-dist"><col class="c-stay"></colgroup>
    <thead><tr><th>Day</th><th>路线（每段可点导航）</th><th>里程</th><th>住宿</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

/* ---------- 主题（跟随系统 + 手动切换，记忆选择）---------- */
(function(){
  const root = document.documentElement, btn = document.getElementById('theme');
  const sysDark = matchMedia('(prefers-color-scheme:dark)');
  const saved = localStorage.getItem('theme');   // 'light' | 'dark' | null(跟随系统)
  if(saved) root.setAttribute('data-theme', saved);
  const isDark = () => (root.getAttribute('data-theme') || (sysDark.matches?'dark':'light')) === 'dark';
  const sync = () => { btn.textContent = isDark() ? '☀️' : '🌙'; };
  sync();
  sysDark.addEventListener('change', sync);
  btn.addEventListener('click', ()=>{
    const next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    sync();
  });
})();

  .addTo(map).bindTooltip('D4 那拉提景区整天', { sticky:true });
d4circle.on('click', ()=>selectDay('D4'));
layers['D4'] = { circle:d4circle, center:d4c, color:'#1abc9c' };
DAYNODES['D4'] = ['xc','dyss'];

// 标记点逻辑：每日住宿点(终点)+起终点 = 锚点，常驻标签；中途点(游客中心/乔尔玛/唐布拉/薰衣草)只在选中当天时显示
const STAYS = new Set(ITIN.map(d=>d.stayKey).filter(Boolean));
Object.entries(N).forEach(([k,n])=>{ if(n.role==='start'||n.role==='end') STAYS.add(k); });
const nodeMarkers = {};
Object.entries(N).filter(([,n])=>!n.mapless).forEach(([key,n])=>{
  const anchor = STAYS.has(key);
  const isStart = n.role==='start', isEnd = n.role==='end';
  const cls = isStart?'start':isEnd?'end':anchor?'hub':'';
  const color = isStart?'#e74c3c':isEnd?'#d81b60':anchor?'#16a085':'#9aa3ad';
  const r = anchor?8:5;
  const m = L.circleMarker([n.lat,n.lon], { radius:r, color:'#fff', weight:2.2, fillColor:color, fillOpacity:1 })
    .addTo(map)
    .bindTooltip(n.short, { permanent:anchor, direction:'top', offset:[0,-7], className:'pt-label '+cls })
    .bindPopup(`<b>${n.short}</b><br><a class="navbtn" href="${navTo(n)}">🧭 高德导航到这里</a>`);
  nodeMarkers[key] = { marker:m, anchor };
});
function showLabels(keys){
  for(const k in nodeMarkers){
    const nm = nodeMarkers[k], m = nm.marker;
    if(keys){                                   // 选中某天：只显示当天的点
      const on = keys.includes(k);
      m.setStyle({ opacity:on?1:0, fillOpacity:on?1:0 });
      if(m._path) m._path.style.pointerEvents = on?'':'none';
      if(on) m.openTooltip(); else m.closeTooltip();
    } else {                                    // 还原：全部点亮，关键点常驻标签
      m.setStyle({ opacity:1, fillOpacity:1 });
      if(m._path) m._path.style.pointerEvents = '';
      if(nm.anchor) m.openTooltip(); else m.closeTooltip();
    }
  }
}
const ALLB = L.latLngBounds(Object.values(N).filter(n=>!n.mapless).map(n=>[n.lat,n.lon]));
map.whenReady(()=>{ setTimeout(()=>{ map.invalidateSize(); map.fitBounds(ALLB.pad(0.12)); }, 60); });

/* ---------- 选中高亮 ---------- */
let activeDay = null;
function selectDay(day){
  if(activeDay === day){ resetView(); return; }
  activeDay = day;
  for(const k in layers){
    const L_ = layers[k], on = (k === day);
    if(L_.main){
      L_.main.setStyle({ opacity:on?1:.12, weight:on?7:3.5, color:on?L_.color:'#9aa3ad' });
      L_.casing.setStyle({ opacity:on?.95:.06 });
      if(on) L_.main.bringToFront();
    }
    if(L_.ring){ L_.ring.setStyle({ opacity:on?1:.1, color:on?L_.color:'#9aa3ad' }); if(on) L_.ring.bringToFront(); }
    if(L_.circle){ L_.circle.setStyle({ opacity:on?1:.15, fillOpacity:on?.12:0 }); }
  }
  const L_ = layers[day];
  let b = L_ && L_.pts ? L.latLngBounds(L_.pts) : null;
  if(L_ && L_.ring) b = b ? b.extend(L.latLngBounds(PATH.ring)) : L.latLngBounds(PATH.ring);
  if(b) map.flyToBounds(b.pad(0.18), { duration:.6 });
  else if(L_ && L_.center) map.flyTo(L_.center, 10, { duration:.6 });
  showLabels(DAYNODES[day]);
  document.querySelectorAll('tr.active').forEach(r=>r.classList.remove('active'));
  const row = document.querySelector(`tr[data-day="${day}"]`);
  if(row){ row.classList.add('active'); }
  document.getElementById('reset').classList.add('show');
}
function resetView(){
  if(activeDay === null) return;
  activeDay = null;
  for(const k in layers){
    const L_ = layers[k];
    if(L_.main){ L_.main.setStyle({ opacity:.95, weight:5, color:L_.color }); L_.casing.setStyle({ opacity:.75 }); }
    if(L_.ring){ L_.ring.setStyle({ opacity:.9, color:L_.color }); }
    if(L_.circle){ L_.circle.setStyle({ opacity:1, fillOpacity:0 }); }
  }
  showLabels(null);
  document.querySelectorAll('tr.active').forEach(r=>r.classList.remove('active'));
  map.flyToBounds(ALLB.pad(0.12), { duration:.6 });
  document.getElementById('reset').classList.remove('show');
}
map.on('click', resetView);

/* ---------- 表格 ---------- */
function routeCell(d){
  let html='';
  if(d.seq){
    const ns = d.seq.map(k=>N[k]);
    html += `<span class="node">${ns[0].short}</span>`;
    for(let i=0;i<d.labels.length;i++){
      html += ` <a class="leg" style="--c:${d.color}" href="${navLeg(ns[i],ns[i+1])}">→ ${d.labels[i]} →</a> `;
      const last = i===d.labels.length-1;
      html += `<span class="node">${ns[i+1].short}${last&&d.suffix?' · '+d.suffix:''}</span>`;
    }
  } else {
    html += `<span class="node">${d.route||''}</span>`;
  }
  if(d.tip) html += `<div class="tip">${d.tip}</div>`;
  if(d.story) html += `<div class="story">${d.story}</div>`;
  return html;
}
const stayIcon = s => /营/.test(s) ? '⛺' : /民宿/.test(s) ? '🏠' : '🏨';
function stayCell(d){
  if(d.stayKey){ const n=N[d.stayKey]; return `<a class="stayA" href="${navTo(n)}">${stayIcon(n.short)} ${n.short}</a>`; }
  return `<span class="stayA flat">${d.stay||''}</span>`;
}
document.getElementById('tbody').innerHTML = ITIN.map(d=>{
  const chip = d.color ? `<span class="chip" style="background:${d.color}">${d.day}</span>`
                       : `<span class="chip" style="background:#b0b0b0">${d.day}</span>`;
  const sel = layers[d.day] ? `selectable` : (d.type==='transit'?'transit':'');
  const attr = layers[d.day] ? ` data-day="${d.day}" style="--rc:${d.color}"` : '';
  return `<tr class="${sel}"${attr}>
    <td class="day">${chip}<span class="date">${d.date}</span></td>
    <td>${routeCell(d)}</td>
    <td class="dist">${d.dist}</td>
    <td class="stay">${stayCell(d)}</td>
  </tr>`;
}).join('');

// 行点击 → 高亮该天（点到导航链接时不触发）
document.querySelectorAll('tr[data-day]').forEach(tr=>{
  tr.addEventListener('click', e=>{
    if(e.target.closest('a')) return;
    selectDay(tr.dataset.day);
  });
});
</script>
</body>
</html>
